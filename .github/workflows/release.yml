name: Release Server Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: server/go.sum
      - run: go test ./...
      - name: Cross-compile static binaries
        run: |
          mkdir -p ../dist
          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
          )
          for target in "${targets[@]}"; do
            read -r goos goarch <<< "$target"
            ext=""
            if [ "$goos" = "windows" ]; then ext=".exe"; fi
            out="../dist/nas-gallery-${goos}-${goarch}${ext}"
            echo "Building ${out}..."
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="-s -w" -o "$out" .
          done
      - name: Build Synology DSM 7 SPK packages
        working-directory: ${{ github.workspace }}
        run: |
          ./packaging/synology/build-spk.sh -v "${GITHUB_REF_NAME}" -o dist all
          cd dist
          sha256sum nas-gallery-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nas-gallery-*
            dist/SHA256SUMS.txt
